name: Unit Tests
on:
  pull_request:
    types: [ready_for_review, opened, synchronize, reopened]

jobs:
  build:
    name: Unit Tests
    runs-on: macos-15
    if: github.event.pull_request.draft == false
    env:
      LC_ALL: en_US.UTF-8
      LANG: en_US.UTF-8
      DEVELOPER_DIR: '/Applications/Xcode_16.4.app/Contents/Developer'
    steps:
    - name: Checkout
      uses: actions/checkout@v4
      with:
        fetch-depth: 100

    - uses: actions/cache@v4
      id: carthage-cache
      with:
        path: Carthage
        key:  ${{ runner.os }}-${{ env.DEVELOPER_DIR }}-carthage-${{ hashFiles('**/Cartfile.resolved') }}

    - name: Carthage
      if: steps.carthage-cache.outputs.cache-hit != 'true'
      run: carthage bootstrap --platform iOS --no-use-binaries --use-xcframeworks

    - name: Bundle Install
      run: bundle install

    - name: Build and run unit tests
      run: bundle exec fastlane unittest

    - name: SonarCloud Scan
      uses: SonarSource/sonarqube-scan-action@v6.0.0
      with:
        args: >-
          ${{ github.event_name == 'merge_group' && format('-Dsonar.pullrequest.branch={0} -Dsonar.pullrequest.key={1}', github.ref, github.run_number) || '' }}
          ${{ github.event_name == 'pull_request' && format('-D sonar.scm.revision={0}', github.event.pull_request.head.sha) || '' }}
          ${{ github.event_name == 'pull_request' && format('-D sonar.pullrequest.key={0}', github.event.pull_request.number) || '' }}
          ${{ github.event_name == 'pull_request' && format('-D sonar.pullrequest.branch={0}', github.head_ref) || '' }}
      env:
        SONAR_TOKEN: ${{ secrets.ORG_SONAR_COMMUNITY_TOKEN }}
        SONAR_HOST_URL: ${{ vars.SONAR_COMMUNITY_URL }}
